<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Luxury Squircle Outer Shell -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#shadowFilter)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Vault Iris Ring -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="12 6" stroke-opacity="0.4" />
  <circle cx="128" cy="128" r="64" fill="#0f172a" fill-opacity="0.6" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Open Research Book / Vault Door Geometry -->
  <path d="M78 84C78 77.3726 83.3726 72 90 72H122V176H90C83.3726 176 78 170.627 78 164V84Z" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
  <path d="M178 84C178 77.3726 172.627 72 166 72H134V176H166C172.627 176 178 170.627 178 164V84Z" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />

  <!-- Center Vault Lock Dial & Bookmark Ribbon -->
  <path d="M120 62H136V152L128 144L120 152V62Z" fill="url(#goldGrad)" />
  <circle cx="128" cy="116" r="16" fill="url(#glowGrad)" filter="url(#shadowFilter)" />
  <circle cx="128" cy="116" r="7" fill="#ffffff" />

  <!-- Text highlight annotations accent line -->
  <rect x="88" y="100" width="24" height="4" rx="2" fill="#fbbf24" fill-opacity="0.8" />
  <rect x="88" y="114" width="20" height="4" rx="2" fill="#34d399" fill-opacity="0.8" />
  <rect x="144" y="100" width="24" height="4" rx="2" fill="#60a5fa" fill-opacity="0.8" />
  <rect x="144" y="114" width="18" height="4" rx="2" fill="#f472b6" fill-opacity="0.8" />
</svg>
